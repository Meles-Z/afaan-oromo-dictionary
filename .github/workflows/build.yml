name: Build Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            artifact: afaan-oromo-dictionary
          - platform: windows/amd64
            os: windows-latest
            artifact: afaan-oromo-dictionary.exe
          - platform: darwin/amd64
            os: macos-13
            artifact: afaan-oromo-dictionary
          - platform: darwin/arm64
            os: macos-latest
            artifact: afaan-oromo-dictionary

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev nsis

      - name: Build
        run: wails build -platform ${{ matrix.platform }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: afaan-oromo-dictionary-${{ matrix.platform }}
          path: build/bin/